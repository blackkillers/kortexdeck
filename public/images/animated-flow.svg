<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Path Gradients -->
    <linearGradient id="pathGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pathGradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="pathGradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pathGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Path Definitions for Motion Guidance -->
    <path id="routeAntigravity" d="M 210 140 C 350 140, 420 50, 560 50" fill="none" />
    <path id="routeClaude" d="M 210 140 C 350 140, 420 110, 560 110" fill="none" />
    <path id="routeCursor" d="M 210 140 C 350 140, 420 170, 560 170" fill="none" />
    <path id="routeCodex" d="M 210 140 C 350 140, 420 230, 560 230" fill="none" />
  </defs>

  <!-- Container Box -->
  <rect width="920" height="280" rx="16" fill="url(#bgCanvas)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="920" height="280" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="140" r="80" fill="#06b6d4" opacity="0.12" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="140" r="100" fill="#3b82f6" opacity="0.06" filter="url(#neonGlow)" />

  <!-- Static Track Lines (Base) -->
  <path d="M 210 140 C 350 140, 420 50, 560 50" fill="none" stroke="#1e293b" stroke-width="3" />
  <path d="M 210 140 C 350 140, 420 110, 560 110" fill="none" stroke="#1e293b" stroke-width="3" />
  <path d="M 210 140 C 350 140, 420 170, 560 170" fill="none" stroke="#1e293b" stroke-width="3" />
  <path d="M 210 140 C 350 140, 420 230, 560 230" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Animated Glowing Stream Lines -->
  <!-- Stream 1: Antigravity -->
  <path d="M 210 140 C 350 140, 420 50, 560 50" fill="none" stroke="url(#pathGradCyan)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Stream 2: Claude -->
  <path d="M 210 140 C 350 140, 420 110, 560 110" fill="none" stroke="url(#pathGradAmber)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Stream 3: Cursor -->
  <path d="M 210 140 C 350 140, 420 170, 560 170" fill="none" stroke="url(#pathGradEmerald)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Stream 4: Codex -->
  <path d="M 210 140 C 350 140, 420 230, 560 230" fill="none" stroke="url(#pathGradPurple)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Traveling Energy Pulse Orbs -->
  <!-- Orb 1: Cyan -->
  <circle r="4" fill="#22d3ee" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#routeAntigravity" />
    </animateMotion>
  </circle>

  <!-- Orb 2: Amber -->
  <circle r="4" fill="#fbbf24" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto" begin="0.45s">
      <mpath href="#routeClaude" />
    </animateMotion>
  </circle>

  <!-- Orb 3: Emerald -->
  <circle r="4" fill="#34d399" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto" begin="0.9s">
      <mpath href="#routeCursor" />
    </animateMotion>
  </circle>

  <!-- Orb 4: Purple -->
  <circle r="4" fill="#c084fc" filter="url(#neonGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto" begin="1.35s">
      <mpath href="#routeCodex" />
    </animateMotion>
  </circle>

  <!-- ================================================================= -->
  <!-- LEFT: KORTEXDECK CENTRAL NEURAL HUB -->
  <!-- ================================================================= -->
  <g transform="translate(30, 65)">
    <!-- Hub Card -->
    <rect width="180" height="150" rx="18" fill="url(#hubGradient)" stroke="#06b6d4" stroke-width="1.8" filter="url(#neonGlow)" />
    
    <!-- Inner Core Circle -->
    <circle cx="90" cy="52" r="26" fill="rgba(6, 182, 212, 0.12)" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r" values="24;27;24" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="90" y="60" text-anchor="middle" font-size="24">⚡</text>

    <!-- Brand Name -->
    <text x="90" y="102" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">
      KORTEXDECK
    </text>
    
    <!-- Sub-badge -->
    <rect x="25" y="114" width="130" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="90" y="128" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">
      500 TOOLS ROUTER
    </text>

    <!-- Source Node Dot -->
    <circle cx="180" cy="75" r="5" fill="#06b6d4" stroke="#050811" stroke-width="1.5">
      <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: TARGET AI PLATFORM CARDS -->
  <!-- ================================================================= -->
  
  <!-- Target 1: Google Antigravity -->
  <g transform="translate(560, 28)">
    <rect width="325" height="44" rx="12" fill="#091326" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      Google Antigravity 2.0
    </text>
    <text x="36" y="34" fill="#64748b" font-family="monospace" font-size="9">
      ~/.gemini/antigravity/rules/kortexdeck.rule
    </text>
    <rect x="245" y="12" width="68" height="20" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" />
    <text x="279" y="25" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold">
      AGY SDK
    </text>
  </g>

  <!-- Target 2: Anthropic Claude -->
  <g transform="translate(560, 88)">
    <rect width="325" height="44" rx="12" fill="#1c1306" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <text x="36" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      Anthropic Claude 3.7
    </text>
    <text x="36" y="34" fill="#64748b" font-family="monospace" font-size="9">
      ~/.claude/CLAUDE.md
    </text>
    <rect x="235" y="12" width="78" height="20" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
    <text x="274" y="25" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">
      CLAUDE.MD
    </text>
  </g>

  <!-- Target 3: Cursor IDE -->
  <g transform="translate(560, 148)">
    <rect width="325" height="44" rx="12" fill="#061a14" stroke="#10b981" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    <text x="36" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      Cursor IDE Composer
    </text>
    <text x="36" y="34" fill="#64748b" font-family="monospace" font-size="9">
      ~/.cursorrules
    </text>
    <rect x="225" y="12" width="88" height="20" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
    <text x="269" y="25" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">
      .CURSORRULES
    </text>
  </g>

  <!-- Target 4: OpenAI Codex / Copilot -->
  <g transform="translate(560, 208)">
    <rect width="325" height="44" rx="12" fill="#150a24" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#a855f7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    <text x="36" y="20" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold">
      OpenAI Codex &amp; Copilot
    </text>
    <text x="36" y="34" fill="#64748b" font-family="monospace" font-size="9">
      system_prompt.json
    </text>
    <rect x="215" y="12" width="98" height="20" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" />
    <text x="264" y="25" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold">
      SYSTEM PROMPT
    </text>
  </g>
</svg>
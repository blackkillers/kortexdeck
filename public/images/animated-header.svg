<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#38bdf8;#818cf8;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#f59e0b;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#06b6d4;#3b82f6;#f59e0b" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="920" height="240" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Scanning Laser Beam -->
  <line x1="0" y1="0" x2="920" y2="0" stroke="url(#beamGrad)" stroke-width="2.5">
    <animate attributeName="y1" values="0;240;0" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;240;0" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- Background Ambient Lights -->
  <circle cx="150" cy="70" r="100" fill="#06b6d4" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="770" cy="170" r="120" fill="#f59e0b" opacity="0.06" filter="url(#glow)">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Synapse Connectors -->
  <g stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="80" y1="40" x2="220" y2="90" />
    <line x1="220" y1="90" x2="350" y2="40" />
    <line x1="680" y1="60" x2="790" y2="120" />
    <line x1="790" y1="120" x2="860" y2="70" />
    <line x1="100" y1="180" x2="220" y2="140" />
    <line x1="670" y1="180" x2="800" y2="200" />
  </g>

  <!-- Pulsing Synaptic Nodes -->
  <circle cx="80" cy="40" r="4" fill="#06b6d4">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="220" cy="90" r="5" fill="#38bdf8">
    <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  <circle cx="350" cy="40" r="4" fill="#818cf8">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite" begin="1s" />
  </circle>
  <circle cx="680" cy="60" r="4" fill="#f59e0b">
    <animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite" begin="0.3s" />
  </circle>
  <circle cx="790" cy="120" r="5" fill="#06b6d4">
    <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" begin="0.7s" />
  </circle>
  <circle cx="860" cy="70" r="3" fill="#34d399">
    <animate attributeName="r" values="2;5;2" dur="1.9s" repeatCount="indefinite" begin="1.2s" />
  </circle>

  <!-- Cyber Badge Top -->
  <g transform="translate(340, 24)">
    <rect width="240" height="24" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" />
    <circle cx="14" cy="12" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      NEURAL COMMAND HUB • v2.5
    </text>
  </g>

  <!-- Main Animated Brand Title -->
  <text x="460" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-1">
    ⚡ KORTEXDECK
  </text>

  <!-- Subtitle -->
  <text x="460" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    500 Curated Skills, Slash Commands &amp; MCP Servers for AI Engineers
  </text>

  <!-- Supported Platforms Row -->
  <g transform="translate(155, 175)">
    <!-- Antigravity -->
    <rect x="0" y="0" width="135" height="30" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="67" y="19" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Google Antigravity</text>

    <!-- Claude -->
    <rect x="150" y="0" width="135" height="30" rx="8" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.3)" />
    <text x="217" y="19" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">Anthropic Claude</text>

    <!-- Cursor -->
    <rect x="300" y="0" width="135" height="30" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="367" y="19" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">Cursor Composer</text>

    <!-- MCP Protocol -->
    <rect x="450" y="0" width="135" height="30" rx="8" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="517" y="19" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">MCP Ecosystem</text>
  </g>
</svg>